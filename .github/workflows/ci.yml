---
name: CI
on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

jobs:
  checks:
    name: Lint & Typecheck
    runs-on: ubuntu-24.04
    if: (!contains(github.ref, 'refs/heads/master') || contains(github.ref, 'refs/tags/v'))
    timeout-minutes: 10
    steps:
      - uses: upfluence/actions/setup-js@master
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          node-version: ${{ vars.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}
      - name: Build Addon
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
  tests:
    name: Tests
    needs: [checks]
    runs-on: ubuntu-24.04
    if: (!contains(github.ref, 'refs/heads/master') || contains(github.ref, 'refs/tags/v'))
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
      GIT_TERMINAL_PROMPT: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ember-lts-3.28
            command: pnpm --filter test-app exec ember try:one ember-lts-3.28
          - name: ember-4.12
            command: pnpm --filter test-app exec ember try:one ember-4.12
    steps:
      - uses: upfluence/actions/setup-js@master
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          node-version: ${{ vars.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}
      - name: Run ${{ matrix.name }} scenario
        run: ${{ matrix.command }}
  build:
    runs-on: ubuntu-24.04
    needs: [checks, tests]
    if: contains(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    steps:
      - uses: upfluence/actions/setup-js@master
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          node-version: ${{ vars.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}
      - name: Ember Build
        run: pnpm build:test-app
      - name: Storybook Build
        run: pnpm build-storybook
      - name: Deploy website
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/test-app/storybook-static/
          cname: storybook.upfluence.co
  release:
    name: Release Package
    runs-on: ubuntu-24.04
    needs: [checks, tests]
    if: contains(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    steps:
      - uses: upfluence/actions/setup-js@master
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          node-version: ${{ vars.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}
      - name: Publish
        working-directory: packages/oss-components
        run: |
          echo "//npm.pkg.github.com/:_authToken=$GITHUB_TOKEN" >> ~/.npmrc
          pnpm publish --no-git-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
