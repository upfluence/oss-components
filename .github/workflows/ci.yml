---
name: CI
on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

jobs:
  # Gates the tests: a type error fails here in ~40s instead of after a full test run.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    if: (!contains(github.ref, 'refs/heads/master') || contains(github.ref, 'refs/tags/v'))
    timeout-minutes: 10
    steps:
      - uses: upfluence/actions/setup-js@master
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          node-version: ${{ vars.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}
      # The test-app resolves the addon's types through its built declarations/.
      - name: Build Addon
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
  # Runs alongside typecheck and the tests, without blocking them.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    if: (!contains(github.ref, 'refs/heads/master') || contains(github.ref, 'refs/tags/v'))
    timeout-minutes: 10
    steps:
      - uses: upfluence/actions/setup-js@master
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          node-version: ${{ vars.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}
      - name: Build Addon
        run: pnpm build
      - name: Lint
        run: pnpm lint
  tests:
    name: Tests
    needs: [typecheck]
    uses: upfluence/actions/.github/workflows/any-js-ember-test.yml@master
    secrets: inherit
    with:
      node-version: ${{ vars.NODE_VERSION }}
      ember-try-working-directory: packages/test-app
      test-variants: |
        [{ "name": "default", "command": "pnpm --workspace-root test" }]
  build:
    runs-on: ubuntu-24.04
    needs: [typecheck, lint, tests]
    if: contains(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    timeout-minutes: 10
    steps:
      - uses: upfluence/actions/setup-js@master
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          node-version: ${{ vars.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}
      - name: Ember Build
        run: pnpm build:test-app
      - name: Storybook Build
        run: pnpm build-storybook
      - name: Deploy website
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/test-app/storybook-static/
          cname: storybook.upfluence.co
  release:
    name: Release Package
    runs-on: ubuntu-24.04
    needs: [typecheck, lint, tests]
    if: contains(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    steps:
      - uses: upfluence/actions/setup-js@master
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          node-version: ${{ vars.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}
      - name: Publish
        working-directory: packages/oss-components
        run: |
          echo "//npm.pkg.github.com/:_authToken=$GITHUB_TOKEN" >> ~/.npmrc
          pnpm publish --no-git-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
